[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-platform"
version = "0.1.0"
description = "Reusable quantitative research and portfolio analysis platform"
requires-python = ">=3.13"

dependencies = [
    "SQLAlchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "httpx>=0.27,<1",
    "pydantic-settings>=2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
