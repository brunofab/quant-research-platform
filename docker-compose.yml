services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend

  research:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SEC_USER_AGENT: ${SEC_USER_AGENT}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile

    command:
      - uvicorn
      - quant_research.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    restart: unless-stopped

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SEC_USER_AGENT: ${SEC_USER_AGENT}

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - backend

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH}

    depends_on:
      - api

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "127.0.0.1:8080:8080"

    volumes:
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge